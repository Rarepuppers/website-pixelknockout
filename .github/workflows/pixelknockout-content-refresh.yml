name: Pixel Knockout content refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh cached schedule and difficulty data
        run: node scripts/refresh-content-cache.mjs
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_SPORT: mma_mixed_martial_arts
          ODDS_REGION: us
          ODDS_MARKET: h2h
      - name: Commit generated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/generated-content.js content/content-refresh-log.md
          git diff --cached --quiet || git commit -m "Refresh Pixel Knockout content cache"
          git push
